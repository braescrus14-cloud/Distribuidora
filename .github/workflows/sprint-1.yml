name: CI Sprint 1

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  smoke:
    # MongoDB 8.0 can fail to start with the newer Linux kernels.
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: villali
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: villali_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U villali -d villali_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: sprint-1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: node --check app.js
      - run: python tests/smoke.py
      - name: Probar PostgreSQL
        run: python tests/smoke.py
        env:
          DATABASE_URL: postgresql://villali:ci-only@127.0.0.1:5432/villali_test
      - name: Iniciar MongoDB para las pruebas
        run: |
          docker run -d --name villali-mongo -p 27017:27017 mongo:8.0 --replSet rs0 --bind_ip_all
          for i in {1..30}; do
            if [ "$(docker inspect -f '{{.State.Running}}' villali-mongo)" != 'true' ]; then
              break
            fi
            if docker exec villali-mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]})'; then
              exit 0
            fi
            sleep 2
          done
          docker logs villali-mongo
          exit 1
      - name: Probar MongoDB
        run: python tests/smoke.py
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0&directConnection=true
          MONGODB_DATABASE: villali_test
