name: CI Sprint 1

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: villali
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: villali_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U villali -d villali_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: sprint-1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: node --check app.js
      - run: python tests/smoke.py
      - name: Probar PostgreSQL
        run: python tests/smoke.py
        env:
          DATABASE_URL: postgresql://villali:ci-only@127.0.0.1:5432/villali_test
