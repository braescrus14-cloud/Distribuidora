services:
  - type: web
    name: villali-staging
    runtime: python
    plan: free
    branch: main
    rootDir: sprint-1
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: villali
      - key: VILLALI_ADMIN_PASSWORD
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: VILLALI_MAIL_FROM
        sync: false
      - key: VILLALI_SECURITY_EMAIL
        sync: false
