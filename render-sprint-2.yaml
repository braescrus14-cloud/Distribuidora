services:
  - type: web
    name: villali-sprint-2
    runtime: python
    plan: free
    branch: sprint-2
    rootDir: sprint-2
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: villali_sprint2
      - key: VILLALI_ADMIN_PASSWORD
        sync: false
      - key: VILLALI_SEED_COMMERCE
        value: "1"
