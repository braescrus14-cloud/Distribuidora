  <aside id="sidebar" class="workspace-header" aria-label="Navegación principal" hidden>
    <div class="workspace-brand"><span class="brand-mark" aria-hidden="true">V</span>
      <div><strong>Villali</strong><span class="subtitle">Operación de bodega</span></div></div>
    <nav id="menu" aria-label="Módulos" hidden></nav>
    <div id="account" hidden><span class="avatar" id="avatar" aria-hidden="true"></span>
      <div><strong id="identity"></strong><span class="subtitle" id="profile-role"></span></div></div>
    <button id="logout" class="secondary">Cerrar sesión</button>
  </aside>
  <main>
    <div id="topbar" class="topbar" hidden>
      <div><button type="button" id="toggle-sidebar" class="secondary icon-button" aria-controls="sidebar" aria-expanded="true" aria-label="Alternar navegación"></button>
      <strong id="section-title">Villali</strong></div>
    </div>
    <noscript><p>Activa JavaScript y abre Villali desde el servidor local.</p></noscript>
    <p id="notice" role="status" hidden></p>
    <section id="login" class="card auth" hidden>
      <div class="access-brand"><span class="brand-mark" aria-hidden="true">V</span><span>Villali</span></div>
      <h1>Iniciar sesión</h1>
      <form id="login-form">
        <label>Usuario <span class="field-icon"><span id="login-user-icon" aria-hidden="true"></span><input name="username" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="Ingresa tu usuario" required></span></label>
        <div><label for="login-password">Contraseña</label><div class="field-icon"><span id="login-lock-icon" aria-hidden="true"></span>
          <input id="login-password" name="password" type="password" autocomplete="current-password" placeholder="Ingresa tu contraseña" required>
          <button type="button" id="toggle-password" class="icon-button" aria-label="Mostrar contraseña" aria-pressed="false"></button></div></div>
        <button>Entrar</button>
      </form>
    </section>
    <section id="activate" class="card auth" hidden>
      <div class="access-brand"><span class="brand-mark" aria-hidden="true">V</span><span>Villali</span></div>
      <h1>Configurar contraseña</h1>
      <p>Usa al menos 10 caracteres con mayúscula, número y símbolo.</p>
      <form id="activate-form">
        <label>Nueva contraseña <input name="password" type="password" autocomplete="new-password" minlength="10" maxlength="128" required></label>
        <button>Guardar contraseña</button>
      </form>
    </section>
    <section id="panel" class="card" hidden></section>
  </main>
